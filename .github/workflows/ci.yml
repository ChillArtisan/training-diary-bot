name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -c constraints.txt pytest
      - run: python examples/make_demo_export.py && git diff --exit-code examples/demo_export
      - run: pytest -q
